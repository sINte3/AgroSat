# AgroSat CI: PostgreSQL/PostGIS contracts (TASK_230), the heavier lane.
#
# A throwaway PostGIS 16 service container, never a production database. The
# database name starts with agrosat_h0a, the prefix the PostgreSQL suites
# require before they touch anything. The container credential below exists
# only inside this job and is not a secret.
#
# main.py refuses to import without a valid SECRET_KEY (TASK_256). The job draws
# its own random key right after setup-python: masked before it is exported,
# handed only to the later steps of this job through GITHUB_ENV, and never
# stored, printed or shared with another job.
name: PostgreSQL contracts

on:
  push:
    branches: [main, "task/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgis:
    name: Migrations and PostgreSQL suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agrosat_ci
          POSTGRES_PASSWORD: agrosat_ci_container_only
          POSTGRES_DB: agrosat_h0a_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrosat_ci -d agrosat_h0a_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://agrosat_ci:agrosat_ci_container_only@localhost:5432/agrosat_h0a_ci
      AGROSAT_TEST_DATABASE_URL: postgresql://agrosat_ci:agrosat_ci_container_only@localhost:5432/agrosat_h0a_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Job-scoped ephemeral SECRET_KEY (test only)
        shell: python
        run: |
          import os
          import sys
          from secrets import token_urlsafe

          if "SECRET_KEY" in os.environ:
              sys.exit("SECRET_KEY is preset; CI uses only a key generated for this job.")
          key = token_urlsafe(48)
          print(f"::add-mask::{key}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as github_env:
              github_env.write(f"SECRET_KEY={key}\n")
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Upgrade an empty PostGIS database to the single head
        working-directory: backend
        run: |
          python -m alembic upgrade head
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic current
      - name: Every shipped migration carries a rollback classification
        run: python -B ops/release/Invoke-AgroSatControlPlane.py rollback-contract --backend backend
      - name: PostgreSQL suites, one process per file
        working-directory: backend
        run: |
          set -e
          for file in tests/*postgres*.py; do
            echo "::group::$file"
            python -m pytest "$file" -q -p no:cacheprovider
            echo "::endgroup::"
          done
